name: Publish package

# Run manually (Actions → Publish package → Run workflow) to publish the current
# version to GitHub Packages without making a new release.
on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          registry-url: https://npm.pkg.github.com
          scope: '@gauravgupta0612'
      - run: npm ci
      - run: npm test
      - run: npm run package
      - name: Publish to GitHub Packages
        run: bash .github/scripts/publish-package.sh
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
