name: Release

# Push a tag like v0.3.0 to build the extension and publish it as a GitHub Release,
# to the VS Code Marketplace (when the VSCE_PAT secret is set) and to GitHub Packages.
on:
  push:
    tags: ['v*']

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      # Job-level so the Marketplace step's `if` can see whether the secret is set.
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          registry-url: https://npm.pkg.github.com
          scope: '@gauravgupta0612'
      - name: Check the tag matches package.json
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ "${GITHUB_REF_NAME#v}" != "$VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $VERSION"
            exit 1
          fi
      - run: npm ci
      - run: npm test
      - run: npm run package
      - name: Release notes from CHANGELOG.md
        run: |
          VERSION=$(node -p "require('./package.json').version")
          awk -v v="## $VERSION" '$0==v{f=1;next} /^## /{f=0} f' CHANGELOG.md > release-notes.md
          {
            echo
            echo "### Install"
            echo
            echo "- **VS Code Marketplace:** search for **Vanthrex for IBM i**, or open https://marketplace.visualstudio.com/items?itemName=gauravgupta0612.vanthrex-ibmi"
            echo "- **Offline:** download the \`.vsix\` below, then Extensions → \`…\` → **Install from VSIX…**"
            echo
            echo "📖 Documentation: https://gauravgupta0612.github.io/vanthrex-ibmi-docs/"
          } >> release-notes.md
          cat release-notes.md
      - uses: softprops/action-gh-release@v2
        with:
          name: Vanthrex for IBM i ${{ github.ref_name }}
          files: '*.vsix'
          body_path: release-notes.md
          generate_release_notes: true
      - name: Publish to the VS Code Marketplace
        if: env.VSCE_PAT != ''
        run: npx vsce publish --no-dependencies --skip-duplicate --packagePath *.vsix
      - name: Publish to GitHub Packages
        run: bash .github/scripts/publish-package.sh
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
